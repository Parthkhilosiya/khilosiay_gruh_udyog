<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      
      #cart {
        max-width: 800px;
        margin: auto;
      }
      
      h1 {
        text-align: center;
        margin-bottom: 20px;
      }
      
      .cart-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      
      .cart-table th, .cart-table td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: center;
      }
      
      .cart-table th {
        background-color: #f8f8f8;
      }
      
      .cart-summary {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
      }
      
      textarea {
        width: 50%;
        height: 100px;
        padding: 10px;
        border: 1px solid #ddd;
      }
      
      .cart-totals {
        width: 50%;
        font-size: 18px;
      }
      
      .cart-totals div {
        margin-bottom: 10px;
      }
      
      button {
        padding: 10px 20px;
        background-color: #e74c3c;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
      }
      
      button:hover {
        background-color: #c0392b;
      }
      
  </style>
</head>
<body>
  <div id="cart">
    <h2>Your Cart</h2>
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody id="cart-items">
        <!-- Cart items will be dynamically inserted here -->
      </tbody>
    </table>
    <div class="cart-summary">
      <textarea placeholder="Special instructions"></textarea>
      <div class="cart-totals">
        <div><strong>Subtotal:</strong> <span id="subtotal">Rs. 0.00</span></div>
        <div><strong>Total:</strong> <span id="total">Rs. 0.00</span></div>
      </div>
      <button id="clear-cart">Clear Cart</button>
      <button id="checkout">Proceed to Checkout</button>
    </div>
  </div>

 // Function to handle quantity change
 function changeQuantity(index, delta) {
   if (cartItems[index].quantity + delta > 0) {
     cartItems[index].quantity += delta;
     renderCart();
   }
 }
 
 // Function to remove an item from the cart
 function removeItem(index) {
   cartItems.splice(index, 1);
   renderCart();
 }
 
 // Clear Cart
 document.getElementById("clear-cart").addEventListener("click", () => {
   cartItems.length = 0;
   renderCart();
 });
 
 // Checkout (placeholder functionality)
 document.getElementById("checkout").addEventListener("click", () => {
   alert("Proceeding to checkout!");
 });
 
 // Add to Cart functionality
 function addToCart(event) {
   const productCard = event.target.closest('.product-card');
   const productName = productCard.getAttribute('data-product-name');
   const productPrice = parseFloat(productCard.getAttribute('data-price'));
   const productWeight = parseInt(productCard.getAttribute('data-weight'));
 
   // Check if item is already in the cart
   const existingItemIndex = cartItems.findIndex(item => item.name === productName);
 
   if (existingItemIndex > -1) {
     // If item exists, increase quantity
     cartItems[existingItemIndex].quantity += 1;
   } else {
     // Otherwise, add new item to the cart
     cartItems.push({ name: productName, price: productPrice, weight: productWeight, quantity: 1 });
   }
 
   renderCart();
 }
 
 // Attach event listeners to all "Add to Cart" buttons
 document.querySelectorAll('.add-to-cart-btn').forEach(button => {
   button.addEventListener('click', addToCart);
 });
 
 // Initial cart render
 renderCart();
          })
          .catch(error => console.error('Error loading sweet.html:', error));
  </script>
 <script src="./index.js"></script>
</body>
</html>
